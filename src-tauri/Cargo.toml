[package]
name = "gestao-oficinas"
version = "0.1.0"
description = "Gestao Oficinas desktop"
authors = ["Pedro Azevedo"]
edition = "2024"
default-run = "gestao-oficinas"
autobins = false

[[bin]]
name = "gestao-oficinas"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "tools/export-bindings.rs"
required-features = ["development-tools"]

[[bin]]
name = "native-probe"
path = "tools/native-probe.rs"
required-features = ["development-tools"]

[[bin]]
name = "gestao-oficinas-launcher"
path = "src/customer_launcher.rs"
required-features = ["customer-launcher"]

[features]
development-tools = []
customer-launcher = []

[lib]
name = "gestao_oficinas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.10.0"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"
base64 = "=0.23.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_IO", "Win32_System_Ioctl"] }
