name: Verify Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build output
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run verify
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: ./setup/Ensure-WebView2.ps1
      - name: Native WebView2 and IPC smoke
        run: npm run native:check
      - name: Save Rust cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
