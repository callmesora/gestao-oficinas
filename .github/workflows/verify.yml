name: Verify desktop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Visual comparison dependency
        run: python -m pip install pillow==13.0.0
      - name: Rust toolchain
        run: rustup show
      - name: C# decoder regression runtime (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Cache Rust dependencies and build output
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: PostgreSQL client source-build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install meson==1.10.0 ninja==1.13.0
      - name: Provision matching backup test clients from checked PostgreSQL source
        run: python setup/provision-backup-test-tools.py --directory analysis-local/ci-backup-tools-18.4 --github-env
      - run: npm run verify
      - name: Ensure WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup/Ensure-WebView2.ps1
      - name: Native WebView2 and IPC smoke
        if: runner.os == 'Windows'
        run: npm run native:check
      - name: Native macOS build
        if: runner.os == 'macOS'
        run: npm run tauri -- build --debug --no-bundle --config src-tauri/tauri.macos.conf.json
      - name: Save Rust cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
